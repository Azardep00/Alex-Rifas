# Alex-Rifas: aplicación multicontenedor (Proyecto 03 - Infraestructura y Seguridad Computacional)
#
# Levantar:   cp .env.example .env   (editar valores)   y luego   docker compose up -d --build
# Detener:    docker compose down          (agrega -v para borrar también los volúmenes de datos)
#
# Arquitectura (3 redes, solo el proxy publica un puerto):
#
#   Internet --> proxy --> web (Python) ---> api (Spring Boot) --> postgres / redis / mongo
#                     \--> visor (Node.js) -/        procesador (Python) <-- cola en redis
#
#   frontend : proxy, web, visor            (entrada web)
#   backend  : proxy, web, visor, api       (el proxy debe alcanzar /api/ y los BFF)
#   data     : api, procesador, bases       (internal: true; las bases no publican puertos)

name: alex-rifas

# Bloque reutilizable: reinicio automático, sin escalada de privilegios y logs con tope de tamaño.
x-comun: &comun
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ------------------------------------------------------------------ ENTRADA
  proxy:
    <<: *comun
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:8080"          # ÚNICO puerto publicado al exterior
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [frontend, backend]
    depends_on:
      web:
        condition: service_healthy
      visor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ------------------------------------------------------------------ APLICACIÓN
  web:                                    # sitio público (Python / Flask)
    <<: *comun
    build: ./web
    image: ${DOCKERHUB_USER:-alexrifas}/alex-rifas-web:${TAG:-latest}
    environment:
      API_URL: http://api:8080
    networks: [frontend, backend]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/salud', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  visor:                                  # visualización de resultados (Node.js / Express)
    <<: *comun
    build: ./visor
    image: ${DOCKERHUB_USER:-alexrifas}/alex-rifas-visor:${TAG:-latest}
    environment:
      API_URL: http://api:8080
      REPORTES_DIR: /reportes
    volumes:
      - reportes:/reportes:ro             # solo lectura: el visor únicamente muestra lo que procesa el worker
    networks: [frontend, backend]
    depends_on:
      procesador:                         # el worker inicializa el volumen con los permisos correctos
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/salud"]
      interval: 15s
      timeout: 3s
      retries: 3

  api:                                    # backend Spring Boot (este repositorio)
    <<: *comun
    build: .
    image: ${DOCKERHUB_USER:-alexrifas}/alex-rifas-api:${TAG:-latest}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Define POSTGRES_DB en .env}
      DB_USERNAME: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (mínimo 32 caracteres)}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
      ADMIN_CORREO: ${ADMIN_CORREO:?Define ADMIN_CORREO en .env}
      ADMIN_CONTRASENA: ${ADMIN_CONTRASENA:?Define ADMIN_CONTRASENA en .env}
    networks: [backend, data]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  procesador:                             # procesamiento de resultados (Python worker, sin puertos)
    <<: *comun
    build: ./procesador
    image: ${DOCKERHUB_USER:-alexrifas}/alex-rifas-procesador:${TAG:-latest}
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
      MONGO_URL: mongodb://${MONGO_USER:?Define MONGO_USER en .env}:${MONGO_PASSWORD:?Define MONGO_PASSWORD en .env}@mongo:27017/?authSource=admin
      MONGO_DB: alexrifas
      REPORTES_DIR: /reportes
    volumes:
      - reportes:/reportes
    networks: [data]
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, time; assert time.time() - os.path.getmtime('/tmp/latido') < 30"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ------------------------------------------------------------------ DATOS
  postgres:
    <<: *comun
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *comun
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}    # lo usa redis-cli en el healthcheck
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    <<: *comun
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Define MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Define MONGO_PASSWORD en .env}
    volumes:
      - mongo_data:/data/db
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  data:
    driver: bridge
    internal: true                        # las bases de datos no tienen salida a internet

volumes:
  pg_data:
  redis_data:
  mongo_data:
  reportes:
