# Proxy inverso: ÚNICA puerta de entrada pública del sistema.
# La API y las bases de datos nunca se exponen; solo "web" y "visor" salen por aquí.

# Resolver DNS interno de Docker: así nginx no se rompe si un contenedor se reinicia y cambia de IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    client_max_body_size 1m;

    # Health-check del propio proxy
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Visor de resultados (Node.js) bajo /visor/
    location = /visor {
        return 301 /visor/;
    }
    location /visor/ {
        set $visor http://visor:3000;
        rewrite ^/visor/(.*)$ /$1 break;
        proxy_pass $visor;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sitio web público (Python) en la raíz
    location / {
        set $web http://web:5000;
        proxy_pass $web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
