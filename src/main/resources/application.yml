server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: alex-rifas-api
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alexrifas}
    username: ${DB_USERNAME:alexrifas}
    password: ${DB_PASSWORD:alexrifas}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  seguridad:
    jwt-secret: ${JWT_SECRET:solo-para-desarrollo-cambiar-secreto-jwt-123456789}
    jwt-expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:15}
    refresh-expiracion-dias: ${REFRESH_EXPIRACION_DIAS:7}
  antiabuso:
    max-pendientes-por-telefono: ${ANTIABUSO_MAX_PENDIENTES_TELEFONO:3}
    max-pendientes-por-ip: ${ANTIABUSO_MAX_PENDIENTES_IP:5}
    saltos-proxy: ${ANTIABUSO_SALTOS_PROXY:1}
  loterias:
    exigir-segundo-verificador: ${LOTERIAS_EXIGIR_SEGUNDO_VERIFICADOR:false}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
