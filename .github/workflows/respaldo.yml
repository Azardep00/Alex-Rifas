name: Respaldo de la base de datos

# Semanal (domingo 08:00 UTC) y bajo demanda desde la pestaña Actions.
on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cliente de Postgres 16
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
      - name: Respaldo cifrado
        env:
          PG_URL: ${{ secrets.PG_URL_RESPALDO }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: ./scripts/respaldo.sh respaldos
      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-bd
          path: respaldos/*.gpg
          retention-days: 30
